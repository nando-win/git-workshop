<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>{{ .Title }}</title>
</head>
<body>
  <header>
    <h1>
      <a href="{{ .Site.Home.RelPermalink }}">
        {{ .Site.Title }}
      </a>
    </h1>
  </header>

  <main>
    {{ if .IsHome }}
      <h2>Minhas postagens</h2>

      {{ range .Site.RegularPages }}
        <article>
          <h3>
            <a href="{{ .RelPermalink }}">
              {{ .Title }}
            </a>
          </h3>
        </article>
      {{ end }}

    {{ else }}
      {{ .Content }}
    {{ end }}
  </main>
</body>
</html>
